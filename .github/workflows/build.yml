name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v152.0.4-beta.30-reverse.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux, windows, macos]
        arch: [x86_64, arm64, i686]
        exclude:
          # Fails (.mozbuild does not include clang++-cl)
          - target: windows
            arch: arm64
          # Unsupported
          - target: macos
            arch: i686
          - target: linux
            arch: i686
          # Reverse r1 ships only platforms covered by the existing project
          # support matrix and local/runtime smoke gates.
          - target: linux
            arch: arm64
          - target: windows
            arch: i686

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Test reverse build tooling
        run: make test-trace-injector

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          # ccache: the mozconfig enables --with-ccache, but the runner image no
          # longer ships it, so configure fails with "Cannot find ccache".
          sudo apt-get install -y msitools p7zip-full aria2 ccache

      - name: Fetch source
        env:
          CAMOUFOX_PASSWD: ${{ secrets.CAMOUFOX_PASSWD }}
        run: |
          make fetch

      - name: Setup and bootstrap
        run: |
          make setup-minimal
          make mozbootstrap
          mkdir -p dist

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build integrity manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path

          expected = {
              'camoufox-152.0.4-beta.30-lin.x86_64.zip': 'camoufox-bin',
              'camoufox-152.0.4-beta.30-mac.arm64.zip':
                  'Camoufox.app/Contents/MacOS/camoufox',
              'camoufox-152.0.4-beta.30-mac.x86_64.zip':
                  'Camoufox.app/Contents/MacOS/camoufox',
              'camoufox-152.0.4-beta.30-win.x86_64.zip': 'camoufox.exe',
          }
          found = {}
          for path in Path('artifacts').rglob('camoufox-*.zip'):
              found.setdefault(path.name, []).append(path)
          if set(found) != set(expected):
              raise SystemExit(
                  f'asset matrix mismatch: expected={sorted(expected)}, found={sorted(found)}'
              )
          duplicates = {name: paths for name, paths in found.items() if len(paths) != 1}
          if duplicates:
              raise SystemExit(f'duplicate asset basenames: {duplicates}')

          assets = []
          sums = []
          for name, executable in expected.items():
              source = found[name][0]
              path = Path(name)
              shutil.copy2(source, path)
              with zipfile.ZipFile(path) as archive:
                  names = {item.filename.rstrip('/') for item in archive.infolist()}
                  required = {'version.json', 'camoufox-reverse-capabilities.json', executable}
                  missing = sorted(required - names)
                  if missing:
                      raise SystemExit(f'{name}: missing archive entries: {missing}')
                  version = json.loads(archive.read('version.json'))
                  capability = json.loads(
                      archive.read('camoufox-reverse-capabilities.json')
                  )
              if version != {'version': '152.0.4', 'release': 'beta.30'}:
                  raise SystemExit(f'{name}: invalid version.json: {version}')
              required_capability = {
                  'schema': 1,
                  'distribution': 'WhiteNightShadow/camoufox-reverse',
                  'upstream_version': '152.0.4-beta.30',
                  'reverse_release': 'reverse.2',
                  'property_trace': True,
                  'property_trace_protocol': 1,
                  'property_trace_hooks': 75,
              }
              if capability != required_capability:
                  raise SystemExit(f'{name}: invalid capability marker: {capability}')
              with path.open('rb') as asset_file:
                  digest = hashlib.file_digest(asset_file, 'sha256').hexdigest()
              assets.append({
                  'name': path.name,
                  'size': path.stat().st_size,
                  'sha256': digest,
              })
              sums.append(f'{digest}  {path.name}')
          Path('SHA256SUMS').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          Path('BUILD-MANIFEST.json').write_text(json.dumps({
              'schema': 1,
              'upstream_tag': 'v152.0.4-beta.30',
              'upstream_commit': '5d06ec1',
              'reverse_release': 'reverse.2',
              'reverse_commit': '${{ github.sha }}',
              'property_trace_hooks': 75,
              'assets': assets,
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            camoufox-*.zip
            SHA256SUMS
            BUILD-MANIFEST.json
            scripts/install-camoufox-reverse.py
          generate_release_notes: true
          body_path: docs/releases/v152.0.4-beta.30-reverse.2.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
