name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: mac-arm64,mac-x86_64,linux-x86_64,win-x86_64)'
        required: false
        default: 'mac-arm64,mac-x86_64,linux-x86_64,win-x86_64'

env:
  FF_VERSION: '135.0.1'
  CF_RELEASE: 'beta.24'
  MOZBUILD_STATE_PATH: /home/ubuntu/.mozbuild

# Self-hosted runner: only 1 job at a time
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: macos
            arch: arm64
            moz_target: aarch64-apple-darwin
            zip_name_suffix: mac.arm64
          - target: macos
            arch: x86_64
            moz_target: x86_64-apple-darwin
            zip_name_suffix: mac.x86_64
          - target: linux
            arch: x86_64
            moz_target: x86_64-pc-linux-gnu
            zip_name_suffix: lin.x86_64
          - target: windows
            arch: x86_64
            moz_target: x86_64-pc-mingw32
            zip_name_suffix: win.x86_64

    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240

    defaults:
      run:
        shell: bash

    steps:
      - name: Fix HOME for self-hosted runner
        run: |
          echo "HOME=/home/ubuntu" >> $GITHUB_ENV
          echo "CARGO_HOME=/home/ubuntu/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=/home/ubuntu/.rustup" >> $GITHUB_ENV
          echo "/home/ubuntu/.cargo/bin" >> $GITHUB_PATH
          echo "/home/ubuntu/.mozbuild/clang/bin" >> $GITHUB_PATH

      - name: Cleanup previous build
        run: |
          sudo rm -rf camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }} || true
          rm -f camoufox-reverse-*.zip || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "HOME=$HOME"
          echo "MOZBUILD=$MOZBUILD_STATE_PATH"
          df -h /
          ls /home/ubuntu/.mozbuild/clang/bin/clang
          rustc --version
          python3 --version

      - name: Link Firefox source
        run: |
          CACHED="/home/ubuntu/camoufox-reverse/firefox-${{ env.FF_VERSION }}.source.tar.xz"
          if [ -f "$CACHED" ]; then
            ln -sf "$CACHED" firefox-${{ env.FF_VERSION }}.source.tar.xz
          else
            aria2c -x16 -s16 -k1M -o firefox-${{ env.FF_VERSION }}.source.tar.xz \
              "https://archive.mozilla.org/pub/firefox/releases/${{ env.FF_VERSION }}/source/firefox-${{ env.FF_VERSION }}.source.tar.xz"
          fi

      - name: Fix config.patch newline
        run: echo "" >> patches/config.patch

      - name: Setup source (no git init)
        run: |
          # Use setup-minimal (skip git init which is very slow on 600MB+ source)
          make setup-minimal
          # Then run patch.py to apply patches and generate mozconfig
          python3 scripts/patch.py ${{ env.FF_VERSION }} ${{ env.CF_RELEASE }}
        env:
          BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}

      - name: Patch mozconfig (disable-bootstrap + clang paths)
        run: |
          SRC=camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }}
          MOZBUILD=/home/ubuntu/.mozbuild
          # Replace --enable-bootstrap with --disable-bootstrap
          sed -i 's/--enable-bootstrap/--disable-bootstrap/' $SRC/mozconfig
          # Add compiler paths and macOS SDK for cross-compile
          cat >> $SRC/mozconfig << EOF

          # CI: use pre-installed toolchain
          ac_add_options --without-wasm-sandboxed-libraries
          export CC="$MOZBUILD/clang/bin/clang"
          export CXX="$MOZBUILD/clang/bin/clang++"
          export HOST_CC="$MOZBUILD/clang/bin/clang"
          export HOST_CXX="$MOZBUILD/clang/bin/clang++"
          EOF
          # macOS cross-compile needs SDK path
          if [ "${{ matrix.target }}" = "macos" ]; then
            echo "ac_add_options --with-macos-sdk=$MOZBUILD/MacOSX14.4.sdk" >> $SRC/mozconfig
          fi
          echo "=== Final mozconfig ==="
          cat $SRC/mozconfig

      - name: Inject PropertyTracer
        run: |
          SRC=camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }}
          python3 scripts/inject-trace-to-source.py $SRC
          grep -q "camoucfg" $SRC/moz.build || echo 'DIRS += ["camoucfg"]' >> $SRC/moz.build

      - name: Build
        run: |
          cd camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }}
          ./mach build

      - name: Stage package
        run: |
          cd camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }}/obj-${{ matrix.moz_target }}
          make -C browser/installer stage-package

      - name: Create zip
        run: |
          python3 << 'PYEOF'
          import os, shutil, tempfile, subprocess
          src_base = f"camoufox-{os.environ['FF_VERSION']}-{os.environ['CF_RELEASE']}/obj-${{ matrix.moz_target }}/dist/camoufox"
          out_zip = f"camoufox-reverse-{os.environ['FF_VERSION']}-{os.environ['CF_RELEASE']}-${{ matrix.zip_name_suffix }}.zip"
          target = "${{ matrix.target }}"
          with tempfile.TemporaryDirectory() as tmp:
              if target == "macos":
                  app_src = os.path.join(src_base, "Camoufox.app")
                  app_dst = os.path.join(tmp, "Camoufox.app")
                  shutil.copytree(app_src, app_dst, symlinks=True)
                  res = os.path.join(app_dst, "Contents", "Resources")
              else:
                  for item in os.listdir(src_base):
                      s = os.path.join(src_base, item)
                      d = os.path.join(tmp, item)
                      if os.path.isdir(s):
                          shutil.copytree(s, d, symlinks=True)
                      else:
                          shutil.copy2(s, d)
                  res = tmp
              for f in ["settings/chrome.css", "settings/properties.json", "settings/camoucfg.jvv"]:
                  if os.path.exists(f):
                      shutil.copy2(f, res)
              fonts_dst = os.path.join(res, "fonts")
              os.makedirs(fonts_dst, exist_ok=True)
              font_sources = {"macos": ["windows", "linux"], "linux": ["windows", "macos"], "windows": ["macos", "linux"]}
              for fo in font_sources.get(target, []):
                  fd = os.path.join("bundle", "fonts", fo)
                  if os.path.isdir(fd):
                      for root, dirs, files in os.walk(fd):
                          for ff in files:
                              shutil.copy2(os.path.join(root, ff), fonts_dst)
              subprocess.run(["zip", "-r", "-9", "-y", os.path.abspath(out_zip), "."],
                           cwd=tmp, check=True, capture_output=True)
          print(f"Created: {out_zip}")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-reverse-${{ matrix.zip_name_suffix }}
          path: camoufox-reverse-*.zip

      - name: Cleanup build directory
        if: always()
        run: sudo rm -rf camoufox-${{ env.FF_VERSION }}-${{ env.CF_RELEASE }} || true

  release:
    needs: build
    runs-on: [self-hosted, linux, x64]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh camoufox-reverse-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: camoufox-reverse-*.zip
          generate_release_notes: true
          draft: false
          prerelease: true
